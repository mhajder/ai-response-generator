name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package/publish (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.tag }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: phar, zip

      - name: Build plugin packages
        run: |
          php -dphar.readonly=0 scripts/build-package.php
          cd dist
          sha256sum ai-response-generator.phar ai-response-generator-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Build release notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          CHANGELOG=$(awk -v heading="## $TAG " -v rp_heading="## [$VERSION](" '
            index($0, heading) == 1 || index($0, rp_heading) == 1 { flag = 1; next }
            /^## / { if (flag) exit }
            flag && (started || NF) { started = 1; print }
          ' CHANGELOG.md 2>/dev/null || true)
          {
            echo "## Release $TAG"
            echo ""
            echo "### 📦 Plugin Packages"
            echo ""
            echo "- \`ai-response-generator.phar\` — Drop-in PHAR archive for osTicket \`include/plugins/\`"
            echo "- \`ai-response-generator-$TAG.zip\` — Unpacked plugin directory archive"
            echo "- \`SHA256SUMS\` — SHA-256 checksums"
            echo ""
            echo "### 📋 Changelog"
            echo ""
            echo "${CHANGELOG:-No changelog entry found for this release.}"
          } > release_notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ contains(steps.meta.outputs.tag, '-') }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release_notes.md --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release_notes.md --prerelease="$PRERELEASE"
          fi
          gh release upload "$TAG" dist/ai-response-generator.phar dist/ai-response-generator-*.zip dist/SHA256SUMS --clobber
